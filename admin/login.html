<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin — Stature Management</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;500;600;700;800;900&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Material Symbols -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap">

    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #050505;
            color: #f0e0ca;
            font-family: 'Manrope', sans-serif;
            min-height: 100vh;
        }

        /* Login Screen */
        .login-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
            background: radial-gradient(circle at 30% 50%, rgba(233, 193, 118, 0.05) 0%, transparent 60%);
        }

        .login-card {
            background: #111111;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 48px 40px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .login-logo {
            font-family: 'Epilogue', sans-serif;
            font-size: 1.8rem;
            font-weight: 900;
            text-transform: uppercase;
            color: #fff;
            display: block;
            margin-bottom: 8px;
        }

        .login-subtitle {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: #e9c176;
        }

        .admin-input {
            width: 100%;
            background: #1a1a1a;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 16px;
            color: #fff;
            font-family: 'Manrope', sans-serif;
            font-size: 0.85rem;
            border-radius: 8px;
            outline: none;
            transition: all 0.2s;
        }

        .admin-input:focus {
            border-color: #e9c176;
        }

        .admin-input::placeholder {
            color: #555;
        }

        .admin-textarea {
            width: 100%;
            background: #1a1a1a;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 16px;
            color: #fff;
            font-family: 'Manrope', sans-serif;
            font-size: 0.85rem;
            border-radius: 8px;
            outline: none;
            resize: vertical;
            min-height: 100px;
        }

        .admin-textarea:focus {
            border-color: #e9c176;
        }

        .admin-label {
            display: block;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #999;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .admin-btn {
            padding: 12px 28px;
            border-radius: 8px;
            font-family: 'Manrope', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }

        .admin-btn-primary {
            background: #e9c176;
            color: #000;
        }

        .admin-btn-primary:hover {
            background: #fff;
            transform: scale(0.98);
        }

        .admin-btn-danger {
            background: transparent;
            border: 1px solid #ff4d4d;
            color: #ff4d4d;
        }

        .admin-btn-danger:hover {
            background: #ff4d4d;
            color: #fff;
        }

        .admin-btn-secondary {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ccc;
        }

        .admin-btn-secondary:hover {
            border-color: #e9c176;
            color: #e9c176;
        }

        .admin-btn-warning {
            background: transparent;
            border: 1px solid #e9c176;
            color: #e9c176;
        }

        .admin-btn-warning:hover {
            background: #e9c176;
            color: #000;
        }

        /* Dashboard */
        .dashboard {
            display: none;
            padding: 32px 24px;
            max-width: 1600px;
            margin: 0 auto;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .dashboard-title {
            font-family: 'Epilogue', sans-serif;
            font-size: 1.5rem;
            font-weight: 900;
            text-transform: uppercase;
            color: #fff;
        }

        .dashboard-subtitle {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #666;
            display: block;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 32px;
            flex-wrap: wrap;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 4px;
        }

        .tab-btn {
            padding: 10px 24px;
            border-radius: 8px 8px 0 0;
            border: none;
            background: transparent;
            color: #888;
            font-family: 'Manrope', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: #e9c176;
            color: #000;
        }

        .tab-btn:hover:not(.active) {
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Cards */
        .admin-card {
            background: #111111;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 28px;
            margin-bottom: 24px;
        }

        .admin-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .admin-card-title {
            font-family: 'Epilogue', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            color: #fff;
        }

        /* Tables */
        .admin-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
        }

        .admin-table th {
            text-align: left;
            padding: 14px 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            color: #999;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-size: 0.65rem;
        }

        .admin-table td {
            padding: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            color: #ccc;
            vertical-align: middle;
        }

        .admin-table tr:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .admin-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 0.6rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .badge-yes {
            background: rgba(233, 193, 118, 0.15);
            color: #e9c176;
        }

        .badge-no {
            background: rgba(255, 255, 255, 0.05);
            color: #666;
        }

        .action-btns {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .action-btn {
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.65rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
        }

        .action-btn-edit {
            background: rgba(233, 193, 118, 0.15);
            color: #e9c176;
        }

        .action-btn-edit:hover {
            background: #e9c176;
            color: #000;
        }

        .action-btn-delete {
            background: rgba(255, 77, 77, 0.15);
            color: #ff4d4d;
        }

        .action-btn-delete:hover {
            background: #ff4d4d;
            color: #fff;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(8px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #111111;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            max-width: 700px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 32px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .modal-title {
            font-family: 'Epilogue', sans-serif;
            font-size: 1.3rem;
            font-weight: 700;
            color: #fff;
        }

        .modal-close {
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            font-size: 1.5rem;
        }

        .modal-close:hover {
            color: #fff;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .form-full {
            grid-column: 1 / -1;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            padding: 14px 24px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            z-index: 3000;
            animation: slideUp 0.3s ease;
        }

        .toast-success {
            background: #1a3a1a;
            border: 1px solid #2d7a2d;
            color: #4ade80;
        }

        .toast-error {
            background: #3a1a1a;
            border: 1px solid #7a2d2d;
            color: #f87171;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #1a1a1a;
        }

        ::-webkit-scrollbar-thumb {
            background: #e9c176;
            border-radius: 3px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            .admin-table {
                font-size: 0.7rem;
            }
            .admin-table th,
            .admin-table td {
                padding: 8px 6px;
            }
            .action-btns {
                flex-direction: column;
                gap: 4px;
            }
        }
    </style>
</head>

<body>

    <!-- ============== LOGIN SCREEN ============== -->
    <div id="login-screen" class="login-screen">
        <div class="login-card">
            <span class="login-logo">Stature</span>
            <span class="login-subtitle">Admin Panel</span>
            <div style="margin-top: 32px; display: flex; flex-direction: column; gap: 20px;">
                <input type="password" id="admin-password" class="admin-input" placeholder="Enter admin password" style="text-align: center;">
                <button id="login-btn" class="admin-btn admin-btn-primary" style="width: 100%;">Access Dashboard</button>
            </div>
            <p id="login-error" style="color: #f87171; font-size: 0.75rem; margin-top: 16px; display: none;">Incorrect password.</p>
        </div>
    </div>

    <!-- ============== DASHBOARD ============== -->
    <div id="dashboard" class="dashboard">
        
        <div class="dashboard-header">
            <div>
                <span class="dashboard-title">Stature Admin</span>
                <span class="dashboard-subtitle">Celebrity & Talent Management</span>
            </div>
            <button id="logout-btn" class="admin-btn admin-btn-secondary">Logout</button>
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-btn active" data-tab="artists">Talents</button>
            <button class="tab-btn" data-tab="tourdates">Upcoming Appearances</button>
            <button class="tab-btn" data-tab="albums">Notable Work</button>
            <button class="tab-btn" data-tab="add-artist">+ Add Talent</button>
            <button class="tab-btn" data-tab="add-tour">+ Add Appearance</button>
            <button class="tab-btn" data-tab="add-album">+ Add Notable Work</button>
        </div>

        <!-- Tab: Artists List -->
        <div id="tab-artists" class="tab-content active">
            <div class="admin-card">
                <div class="admin-card-header">
                    <h3 class="admin-card-title">All Talents</h3>
                    <button class="admin-btn admin-btn-primary" style="padding: 8px 20px;" onclick="switchTab('add-artist')">+ New Talent</button>
                </div>
                <div id="artists-table-container" style="overflow-x: auto;">
                    <p style="color: #666;">Loading talents...</p>
                </div>
            </div>
        </div>

        <!-- Tab: Upcoming Appearances (formerly Tour Dates) -->
        <div id="tab-tourdates" class="tab-content">
            <div class="admin-card">
                <div class="admin-card-header">
                    <h3 class="admin-card-title">All Upcoming Appearances</h3>
                    <div style="display: flex; gap: 12px;">
                        <select id="tour-artist-filter" class="admin-input" style="width: 200px;">
                            <option value="">All Talents</option>
                        </select>
                        <button class="admin-btn admin-btn-primary" style="padding: 8px 20px;" onclick="switchTab('add-tour')">+ Add Appearance</button>
                    </div>
                </div>
                <div id="tourdates-table-container" style="overflow-x: auto;">
                    <p style="color: #666;">Loading appearances...</p>
                </div>
            </div>
        </div>

        <!-- Tab: Notable Work (formerly Albums) -->
        <div id="tab-albums" class="tab-content">
            <div class="admin-card">
                <div class="admin-card-header">
                    <h3 class="admin-card-title">All Notable Work</h3>
                    <div style="display: flex; gap: 12px;">
                        <select id="album-artist-filter" class="admin-input" style="width: 200px;">
                            <option value="">All Talents</option>
                        </select>
                        <button class="admin-btn admin-btn-primary" style="padding: 8px 20px;" onclick="switchTab('add-album')">+ Add Notable Work</button>
                    </div>
                </div>
                <div id="albums-table-container" style="overflow-x: auto;">
                    <p style="color: #666;">Loading notable work...</p>
                </div>
            </div>
        </div>

        <!-- Tab: Add Artist Form (renamed Add Talent) -->
        <div id="tab-add-artist" class="tab-content">
            <div class="admin-card">
                <h3 class="admin-card-title" style="margin-bottom: 24px;">Add New Talent</h3>
                <form id="add-artist-form">
                    <div class="form-grid">
                        <div><label class="admin-label">Name *</label><input name="name" required class="admin-input" placeholder="Celebrity name"></div>
                        <div><label class="admin-label">Slug *</label><input name="slug" required class="admin-input" placeholder="name-url (e.g., riley-green)"></div>
                        <div><label class="admin-label">Category</label><input name="genre" class="admin-input" placeholder="e.g., Actor, Athlete, Musician, Speaker"></div>
                        <div><label class="admin-label">Agency / Representation</label><input name="label" class="admin-input" placeholder="e.g., CAA, WME, Independent"></div>
                        <div class="form-full"><label class="admin-label">Tagline</label><input name="tagline" class="admin-input" placeholder="Short tagline for the celebrity"></div>
                        <div class="form-full"><label class="admin-label">Bio</label><textarea name="bio" class="admin-textarea" placeholder="Full biography..."></textarea></div>
                        <div><label class="admin-label">Photo URL</label><input name="photo_url" class="admin-input" placeholder="https://... (card image)"></div>
                        <div><label class="admin-label">Hero Image URL</label><input name="hero_image_url" class="admin-input" placeholder="https://... (profile hero)"></div>
                        <div><label class="admin-label">Instagram</label><input name="instagram" class="admin-input" placeholder="@username"></div>
                        <div><label class="admin-label">Twitter/X</label><input name="twitter" class="admin-input" placeholder="@username"></div>
                        <div><label class="admin-label">Facebook</label><input name="facebook" class="admin-input" placeholder="username"></div>
                        <div><label class="admin-label">TikTok</label><input name="tiktok" class="admin-input" placeholder="@username"></div>
                        <div><label class="admin-label">Custom Link 1 (ex‑Spotify ID)</label><input name="spotify_id" class="admin-input" placeholder="Optional: IMDb ID, Spotify ID, etc."></div>
                        <div><label class="admin-label">Custom Link 2 (ex‑Apple Music ID)</label><input name="apple_music_id" class="admin-input" placeholder="Optional"></div>
                        <div><label class="admin-label">YouTube / Custom Channel</label><input name="youtube_channel" class="admin-input" placeholder="UC... or custom URL"></div>
                        <div style="display: flex; align-items: center; gap: 12px;">
                            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                                <input type="checkbox" name="featured" value="true">
                                <span class="admin-label" style="margin: 0;">Featured Talent</span>
                            </label>
                        </div>
                    </div>
                    <div style="margin-top: 24px; display: flex; gap: 12px; justify-content: flex-end;">
                        <button type="button" onclick="switchTab('artists')" class="admin-btn admin-btn-secondary">Cancel</button>
                        <button type="submit" class="admin-btn admin-btn-primary">Add Talent</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Tab: Add Tour Date Form (Add Upcoming Appearance) -->
        <div id="tab-add-tour" class="tab-content">
            <div class="admin-card">
                <h3 class="admin-card-title" style="margin-bottom: 24px;">Add Upcoming Appearance</h3>
                <form id="add-tour-form">
                    <div class="form-grid">
                        <div class="form-full"><label class="admin-label">Talent *</label><select name="artist_id" required class="admin-input" id="tour-artist-select"></select></div>
                        <div><label class="admin-label">Date *</label><input name="date" type="date" required class="admin-input"></div>
                        <div><label class="admin-label">Venue / Event *</label><input name="venue" required class="admin-input" placeholder="Venue or event name"></div>
                        <div><label class="admin-label">City *</label><input name="city" required class="admin-input" placeholder="City, State/Country"></div>
                        <div class="form-full"><label class="admin-label">Ticket / Booking URL</label><input name="ticket_url" class="admin-input" placeholder="https://..."></div>
                        <div><label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                                <input type="checkbox" name="sold_out" value="true">
                                <span class="admin-label" style="margin: 0;">Sold Out / Unavailable</span>
                            </label>
                        </div>
                    </div>
                    <div style="margin-top: 24px; display: flex; gap: 12px; justify-content: flex-end;">
                        <button type="button" onclick="switchTab('tourdates')" class="admin-btn admin-btn-secondary">Cancel</button>
                        <button type="submit" class="admin-btn admin-btn-primary">Add Appearance</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Tab: Add Album Form (Add Notable Work) -->
        <div id="tab-add-album" class="tab-content">
            <div class="admin-card">
                <h3 class="admin-card-title" style="margin-bottom: 24px;">Add Notable Work</h3>
                <form id="add-album-form">
                    <div class="form-grid">
                        <div class="form-full"><label class="admin-label">Talent *</label><select name="artist_id" required class="admin-input" id="album-artist-select"></select></div>
                        <div><label class="admin-label">Title *</label><input name="title" required class="admin-input" placeholder="Project title (movie, album, campaign)"></div>
                        <div><label class="admin-label">Year</label><input name="year" type="number" class="admin-input" placeholder="2024"></div>
                        <div><label class="admin-label">Type</label><select name="type" class="admin-input">
                                <option value="Movie">Movie</option>
                                <option value="TV Show">TV Show</option>
                                <option value="Campaign">Campaign</option>
                                <option value="Album">Album</option>
                                <option value="EP">EP</option>
                                <option value="Single">Single</option>
                            </select>
                        </div>
                        <div class="form-full"><label class="admin-label">Image / Artwork URL</label><input name="artwork_url" class="admin-input" placeholder="https://... (poster, cover)"></div>
                    </div>
                    <div style="margin-top: 24px; display: flex; gap: 12px; justify-content: flex-end;">
                        <button type="button" onclick="switchTab('albums')" class="admin-btn admin-btn-secondary">Cancel</button>
                        <button type="submit" class="admin-btn admin-btn-primary">Add Notable Work</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="edit-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title" id="modal-title">Edit Item</h3>
                <button class="modal-close" onclick="closeModal()">✕</button>
            </div>
            <div id="modal-body"></div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

            const password = document.getElementById('admin-password').value;
            if (password === ADMIN_PASSWORD) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                sessionStorage.setItem('stature_admin_auth', 'true');
                initDashboard();
            } else {
                document.getElementById('login-error').style.display = 'block';
            }
        }

        function logout() {
            sessionStorage.removeItem('stature_admin_auth');
            document.getElementById('login-screen').style.display = 'flex';
            document.getElementById('dashboard').style.display = 'none';
        }

        // ============================================
        // TAB SWITCHING
        // ============================================
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-' + tabName).classList.add('active');
            
            const buttons = document.querySelectorAll('.tab-btn');
            buttons.forEach(btn => {
                if (btn.getAttribute('data-tab') === tabName) {
                    btn.classList.add('active');
                }
            });

            if (tabName === 'artists') loadArtists();
            if (tabName === 'tourdates') { loadArtistDropdowns(); loadAllTourDates(); }
            if (tabName === 'albums') { loadArtistDropdowns(); loadAllAlbums(); }
            if (tabName === 'add-tour') loadArtistDropdowns();
            if (tabName === 'add-album') loadArtistDropdowns();
        }

        function initTabs() {
            const tabButtons = document.querySelectorAll('.tab-btn');
            tabButtons.forEach(btn => {
                btn.addEventListener('click', function() {
                    const tabName = this.getAttribute('data-tab');
                    if (tabName) switchTab(tabName);
                });
            });
        }

        // ============================================
        // INIT DASHBOARD
        // ============================================
        async function initDashboard() {
            initTabs();
            await loadArtists();
            loadArtistDropdowns();
            
            document.getElementById('tour-artist-filter')?.addEventListener('change', loadAllTourDates);
            document.getElementById('album-artist-filter')?.addEventListener('change', loadAllAlbums);
            
            document.getElementById('add-artist-form')?.addEventListener('submit', addArtist);
            document.getElementById('add-tour-form')?.addEventListener('submit', addTourDate);
            document.getElementById('add-album-form')?.addEventListener('submit', addAlbum);
        }

        // ============================================
        // LOAD ARTISTS (Talents)
        // ============================================
        async function loadArtists() {
            const client = getSupabase();
            if (!client) return;

            const { data, error } = await client.from('artists').select('*').order('name');
            if (error) { toast('Failed to load talents', 'error'); return; }

            currentArtists = data || [];
            renderArtistsTable(currentArtists);
        }

        function renderArtistsTable(artists) {
            const container = document.getElementById('artists-table-container');
            if (!artists.length) {
                container.innerHTML = '<p style="color: #666; text-align: center; padding: 40px;">No talents yet. Add your first talent.</p>';
                return;
            }

            let html = '<table class="admin-table"><thead><tr><th>Name</th><th>Slug</th><th>Category</th><th>Featured</th><th style="width: 150px;">Actions</th></tr></thead><tbody>';
            artists.forEach(a => {
                html += `
                    <tr>
                        <td><strong>${escapeHtml(a.name)}</strong></td>
                        <td>${escapeHtml(a.slug)}</td>
                        <td>${escapeHtml(a.genre) || '—'}</td>
                        <td><span class="admin-badge ${a.featured ? 'badge-yes' : 'badge-no'}">${a.featured ? 'Yes' : 'No'}</span></td>
                        <td class="action-btns">
                            <button onclick="openEditArtist(${a.id})" class="action-btn action-btn-edit">Edit</button>
                            <button onclick="deleteArtist(${a.id})" class="action-btn action-btn-delete">Delete</button>
                        </td>
                    </tr>
                `;
            });
            html += '</tbody></table>';
            container.innerHTML = html;
        }

        // ============================================
        // EDIT ARTIST (Modal)
        // ============================================

            const client = getSupabase();
            const { data: artist, error } = await client.from('artists').select('*').eq('id', artistId).single();

                <form id="edit-artist-form" onsubmit="updateArtist(event, ${artist.id})">
                    <div class="form-grid">
                        <div><label class="admin-label">Name *</label><input name="name" required class="admin-input" value="${escapeHtml(artist.name)}"></div>
                        <div><label class="admin-label">Slug *</label><input name="slug" required class="admin-input" value="${escapeHtml(artist.slug)}"></div>
                        <div><label class="admin-label">Category</label><input name="genre" class="admin-input" value="${escapeHtml(artist.genre || '')}"></div>
                        <div><label class="admin-label">Agency</label><input name="label" class="admin-input" value="${escapeHtml(artist.label || '')}"></div>
                        <div class="form-full"><label class="admin-label">Tagline</label><input name="tagline" class="admin-input" value="${escapeHtml(artist.tagline || '')}"></div>

                        <div><label class="admin-label">Hero Image URL</label><input name="hero_image_url" class="admin-input" value="${escapeHtml(artist.hero_image_url || '')}"></div>
                        <div><label class="admin-label">Instagram</label><input name="instagram" class="admin-input" value="${escapeHtml(artist.instagram || '')}"></div>
                        <div><label class="admin-label">Twitter/X</label><input name="twitter" class="admin-input" value="${escapeHtml(artist.twitter || '')}"></div>
                        <div><label class="admin-label">Facebook</label><input name="facebook" class="admin-input" value="${escapeHtml(artist.facebook || '')}"></div>
                        <div><label class="admin-label">TikTok</label><input name="tiktok" class="admin-input" value="${escapeHtml(artist.tiktok || '')}"></div>
                        <div><label class="admin-label">Custom Link 1</label><input name="spotify_id" class="admin-input" value="${escapeHtml(artist.spotify_id || '')}"></div>
                        <div><label class="admin-label">Custom Link 2</label><input name="apple_music_id" class="admin-input" value="${escapeHtml(artist.apple_music_id || '')}"></div>
                        <div><label class="admin-label">YouTube / Custom</label><input name="youtube_channel" class="admin-input" value="${escapeHtml(artist.youtube_channel || '')}"></div>
                        <div><label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                                <input type="checkbox" name="featured" ${artist.featured ? 'checked' : ''}>
                                <span class="admin-label" style="margin: 0;">Featured Talent</span>

                    </div>

                        <button type="submit" class="admin-btn admin-btn-primary">Save Changes</button>
                    </div>
                </form>

            modal.classList.add('active');

        async function updateArtist(event, artistId) {
            event.preventDefault();
            const form = event.target;
            const client = getSupabase();

            const updates = {
                name: form.name.value,
                slug: form.slug.value,
                genre: form.genre.value || null,
                label: form.label.value || null,
                tagline: form.tagline.value || null,
                bio: form.bio.value || null,
                photo_url: form.photo_url.value || null,
                hero_image_url: form.hero_image_url.value || null,
                instagram: form.instagram.value || null,
                twitter: form.twitter.value || null,
                facebook: form.facebook.value || null,
                tiktok: form.tiktok.value || null,
                spotify_id: form.spotify_id.value || null,
                apple_music_id: form.apple_music_id.value || null,
                youtube_channel: form.youtube_channel.value || null,
                featured: form.featured ? form.featured.checked : false
            };

            const { error } = await client.from('artists').update(updates).eq('id', artistId);
            if (error) { toast('Error updating talent: ' + error.message, 'error'); return; }

            toast('Talent updated successfully!', 'success');
            closeModal();
            loadArtists();

        // ============================================
        // DELETE ARTIST
        // ============================================
        async function deleteArtist(id) {
            if (!confirm('⚠️ Warning: This will delete the talent AND all their upcoming appearances and notable work. Are you sure?')) return;
            const client = getSupabase();
            if (!client) return;

            await client.from('tour_dates').delete().eq('artist_id', id);
            await client.from('albums').delete().eq('artist_id', id);
            const { error } = await client.from('artists').delete().eq('id', id);

            if (error) { toast('Error deleting talent', 'error'); return; }
            toast('Talent deleted successfully', 'success');
            loadArtists();
            loadArtistDropdowns();
        }

        // ============================================
        // ADD ARTIST (TALENT)
        // ============================================
        async function addArtist(event) {
            event.preventDefault();
            const form = event.target;
            const client = getSupabase();
            if (!client) return;

            const artist = {
                name: form.name.value,
                slug: form.slug.value,
                genre: form.genre.value || null,
                label: form.label.value || null,
                tagline: form.tagline.value || null,
                bio: form.bio.value || null,
                photo_url: form.photo_url.value || null,
                hero_image_url: form.hero_image_url.value || null,
                instagram: form.instagram.value || null,
                twitter: form.twitter.value || null,
                facebook: form.facebook.value || null,
                tiktok: form.tiktok.value || null,
                spotify_id: form.spotify_id.value || null,
                apple_music_id: form.apple_music_id.value || null,
                youtube_channel: form.youtube_channel.value || null,
                featured: form.featured ? form.featured.checked : false
            };

            loadArtists();
            loadArtistDropdowns();

        // ============================================
        // ARTIST DROPDOWNS
        // ============================================
        async function loadArtistDropdowns() {
            const client = getSupabase();
            if (!client) return;
            const { data } = await client.from('artists').select('id, name').order('name');
            currentArtists = data || [];

            const dropdowns = ['tour-artist-filter', 'album-artist-filter', 'tour-artist-select', 'album-artist-select'];
            dropdowns.forEach(did => {
                const sel = document.getElementById(did);
                if (!sel) return;
                sel.innerHTML = '<option value="">All Talents</option>';
                currentArtists.forEach(a => {
                    sel.innerHTML += `<option value="${a.id}">${escapeHtml(a.name)}</option>`;
                });
            });
        }

        // ============================================
        // UPCOMING APPEARANCES (TOUR DATES)
        // ============================================
        async function loadAllTourDates() {
            const artistId = document.getElementById('tour-artist-filter').value;
            const container = document.getElementById('tourdates-table-container');
            const client = getSupabase();

            let query = client.from('tour_dates').select('*, artists(name)');
            if (artistId) query = query.eq('artist_id', artistId);
            const { data, error } = await query.order('date');

            if (error) { container.innerHTML = '<p style="color: #f87171;">Error loading.</p>'; return; }
            if (!data || data.length === 0) { container.innerHTML = '<p style="color: #666; text-align: center; padding: 40px;">No upcoming appearances found.</p>'; return; }

            let html = '<table class="admin-table"><thead><tr><th>Talent</th><th>Date</th><th>Venue / Event</th><th>City</th><th>Status</th><th style="width: 120px;">Actions</th></tr></thead><tbody>';
            data.forEach(d => {
                html += `
                    <tr>
                        <td><strong>${escapeHtml(d.artists?.name)}</strong></td>
                        <td>${d.date}</td>
                        <td>${escapeHtml(d.venue)}</td>
                        <td>${escapeHtml(d.city)}</td>
                        <td><span class="admin-badge ${d.sold_out ? 'badge-no' : 'badge-yes'}">${d.sold_out ? 'Sold Out' : 'Available'}</span></td>
                        <td class="action-btns">
                            <button onclick="openEditTourDate(${d.id})" class="action-btn action-btn-edit">Edit</button>
                            <button onclick="deleteTourDate(${d.id})" class="action-btn action-btn-delete">Delete</button>
                        </td>
                    </tr>
                `;
            });
            html += '</tbody></table>';
            container.innerHTML = html;
        }

        async function openEditTourDate(tourId) {
            const client = getSupabase();
            const { data: tour, error } = await client.from('tour_dates').select('*').eq('id', tourId).single();
            if (error) { toast('Error loading appearance', 'error'); return; }

            const artists = await client.from('artists').select('id, name');
            const artistOptions = artists.data?.map(a => `<option value="${a.id}" ${a.id === tour.artist_id ? 'selected' : ''}>${escapeHtml(a.name)}</option>`).join('') || '';

            const modal = document.getElementById('edit-modal');
            document.getElementById('modal-title').textContent = 'Edit Upcoming Appearance';
            document.getElementById('modal-body').innerHTML = `
                <form id="edit-tour-form" onsubmit="updateTourDate(event, ${tour.id})">
                    <div class="form-grid">
                        <div class="form-full"><label class="admin-label">Talent *</label><select name="artist_id" required class="admin-input">${artistOptions}</select></div>
                        <div><label class="admin-label">Date *</label><input name="date" type="date" required class="admin-input" value="${tour.date}"></div>
                        <div><label class="admin-label">Venue / Event *</label><input name="venue" required class="admin-input" value="${escapeHtml(tour.venue)}"></div>
                        <div><label class="admin-label">City *</label><input name="city" required class="admin-input" value="${escapeHtml(tour.city)}"></div>
                        <div class="form-full"><label class="admin-label">Ticket URL</label><input name="ticket_url" class="admin-input" value="${escapeHtml(tour.ticket_url || '')}"></div>
                        <div><label style="display: flex; align-items: center; gap: 8px;">
                                <input type="checkbox" name="sold_out" ${tour.sold_out ? 'checked' : ''}>
                                <span class="admin-label">Sold Out</span>
                            </label>
                        </div>
                    </div>
                    <div style="margin-top: 24px; display: flex; gap: 12px; justify-content: flex-end;">
                        <button type="button" onclick="closeModal()" class="admin-btn admin-btn-secondary">Cancel</button>
                        <button type="submit" class="admin-btn admin-btn-primary">Save Changes</button>
                    </div>
                </form>
            `;
            modal.classList.add('active');
        }

        async function updateTourDate(event, tourId) {
            event.preventDefault();
            const form = event.target;
            const client = getSupabase();

            const updates = {
                artist_id: parseInt(form.artist_id.value),
                date: form.date.value,
                venue: form.venue.value,
                city: form.city.value,
                ticket_url: form.ticket_url.value || null,
                sold_out: form.sold_out ? form.sold_out.checked : false
            };

            const { error } = await client.from('tour_dates').update(updates).eq('id', tourId);
            if (error) { toast('Error updating appearance', 'error'); return; }

            toast('Appearance updated!', 'success');
            closeModal();
            loadAllTourDates();
        }

        async function deleteTourDate(id) {
            if (!confirm('Delete this appearance?')) return;
            const client = getSupabase();
            await client.from('tour_dates').delete().eq('id', id);
            toast('Appearance deleted', 'success');
            loadAllTourDates();
        }

        async function addTourDate(event) {
            event.preventDefault();
            const form = event.target;
            const client = getSupabase();

            const tourDate = {
                artist_id: parseInt(form.artist_id.value),
                date: form.date.value,
                venue: form.venue.value,
                city: form.city.value,
                ticket_url: form.ticket_url.value || null,
                sold_out: form.sold_out ? form.sold_out.checked : false
            };

            const { error } = await client.from('tour_dates').insert([tourDate]);
            if (error) { toast('Error: ' + error.message, 'error'); return; }

            toast('Appearance added!', 'success');
            form.reset();
            loadAllTourDates();
            switchTab('tourdates');
        }

        // ============================================
        // NOTABLE WORK (ALBUMS)
        // ============================================
        async function loadAllAlbums() {
            const artistId = document.getElementById('album-artist-filter').value;
            const container = document.getElementById('albums-table-container');
            const client = getSupabase();

            let query = client.from('albums').select('*, artists(name)');
            if (artistId) query = query.eq('artist_id', artistId);
            const { data, error } = await query.order('year', { ascending: false });

            if (error) { container.innerHTML = '<p style="color: #f87171;">Error loading.</p>'; return; }
            if (!data || data.length === 0) { container.innerHTML = '<p style="color: #666; text-align: center; padding: 40px;">No notable work found.</p>'; return; }

            let html = '<table class="admin-table"><thead><tr><th>Talent</th><th>Title</th><th>Year</th><th>Type</th><th style="width: 120px;">Actions</th></tr></thead><tbody>';
            data.forEach(d => {
                html += `
                    <tr>
                        <td><strong>${escapeHtml(d.artists?.name)}</strong></td>
                        <td>${escapeHtml(d.title)}</td>
                        <td>${d.year || '—'}</td>
                        <td>${d.type || '—'}</td>
                        <td class="action-btns">
                            <button onclick="openEditAlbum(${d.id})" class="action-btn action-btn-edit">Edit</button>
                            <button onclick="deleteAlbum(${d.id})" class="action-btn action-btn-delete">Delete</button>
                        </td>
                    </tr>
                `;
            });
            html += '</tbody></table>';
            container.innerHTML = html;
        }

        async function openEditAlbum(albumId) {
            const client = getSupabase();
            const { data: album, error } = await client.from('albums').select('*').eq('id', albumId).single();
            if (error) { toast('Error loading notable work', 'error'); return; }

            const artists = await client.from('artists').select('id, name');
            const artistOptions = artists.data?.map(a => `<option value="${a.id}" ${a.id === album.artist_id ? 'selected' : ''}>${escapeHtml(a.name)}</option>`).join('') || '';

            const modal = document.getElementById('edit-modal');
            document.getElementById('modal-title').textContent = 'Edit Notable Work';
            document.getElementById('modal-body').innerHTML = `
                <form id="edit-album-form" onsubmit="updateAlbum(event, ${album.id})">
                    <div class="form-grid">
                        <div class="form-full"><label class="admin-label">Talent *</label><select name="artist_id" required class="admin-input">${artistOptions}</select></div>
                        <div><label class="admin-label">Title *</label><input name="title" required class="admin-input" value="${escapeHtml(album.title)}"></div>
                        <div><label class="admin-label">Year</label><input name="year" type="number" class="admin-input" value="${album.year || ''}"></div>
                        <div><label class="admin-label">Type</label><select name="type" class="admin-input">
                                <option value="Movie" ${album.type === 'Movie' ? 'selected' : ''}>Movie</option>
                                <option value="TV Show" ${album.type === 'TV Show' ? 'selected' : ''}>TV Show</option>
                                <option value="Campaign" ${album.type === 'Campaign' ? 'selected' : ''}>Campaign</option>
                                <option value="Album" ${album.type === 'Album' ? 'selected' : ''}>Album</option>

                                <option value="Single" ${album.type === 'Single' ? 'selected' : ''}>Single</option>
                            </select>
                        </div>
                        <div class="form-full"><label class="admin-label">Image URL</label><input name="artwork_url" class="admin-input" value="${escapeHtml(album.artwork_url || '')}"></div>
                    </div>
                    <div style="margin-top: 24px; display: flex; gap: 12px; justify-content: flex-end;">
                        <button type="button" onclick="closeModal()" class="admin-btn admin-btn-secondary">Cancel</button>
                        <button type="submit" class="admin-btn admin-btn-primary">Save Changes</button>
                    </div>
                </form>
            `;
            modal.classList.add('active');
        }

        async function updateAlbum(event, albumId) {
            event.preventDefault();
            const form = event.target;
            const client = getSupabase();

            const updates = {
                artist_id: parseInt(form.artist_id.value),
                title: form.title.value,
                year: form.year.value ? parseInt(form.year.value) : null,
                type: form.type.value,
                artwork_url: form.artwork_url.value || null
            };

            const { error } = await client.from('albums').update(updates).eq('id', albumId);
            if (error) { toast('Error updating notable work', 'error'); return; }

            toast('Notable work updated!', 'success');
            closeModal();
            loadAllAlbums();
        }

        async function deleteAlbum(id) {
            if (!confirm('Delete this notable work?')) return;
            const client = getSupabase();
            await client.from('albums').delete().eq('id', id);
            toast('Notable work deleted', 'success');
            loadAllAlbums();
        }

        async function addAlbum(event) {
            event.preventDefault();
            const form = event.target;
            const client = getSupabase();

            const album = {
                artist_id: parseInt(form.artist_id.value),
                title: form.title.value,
                year: form.year.value ? parseInt(form.year.value) : null,
                type: form.type.value,
                artwork_url: form.artwork_url.value || null
            };

            const { error } = await client.from('albums').insert([album]);
            if (error) { toast('Error: ' + error.message, 'error'); return; }

            toast('Notable work added!', 'success');
            form.reset();
            loadAllAlbums();
            switchTab('albums');
        }

        // ============================================
        // MODAL & UTILITIES
        // ============================================
        function closeModal() {
            document.getElementById('edit-modal').classList.remove('active');
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        // ============================================
        // SETUP EVENT LISTENERS ON PAGE LOAD
        // ============================================
        document.addEventListener('DOMContentLoaded', function() {
            const loginBtn = document.getElementById('login-btn');
            if (loginBtn) loginBtn.addEventListener('click', login);
            const passwordInput = document.getElementById('admin-password');
            if (passwordInput) passwordInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') login(); });
            const logoutBtn = document.getElementById('logout-btn');
            if (logoutBtn) logoutBtn.addEventListener('click', logout);
            if (sessionStorage.getItem('stature_admin_auth') === 'true') {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                initDashboard();
            }
        });
    </script>
</body>

</html>
